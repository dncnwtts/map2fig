[package]
name = "map2fig"
version = "0.2.0"
edition = "2024"
authors = ["Duncan Watts"]
description = "Fast, publication-quality HEALPix sky map visualization in Rust"
documentation = "https://docs.rs/map2fig"
homepage = "https://github.com/dncnwtts/map2fig"
repository = "https://github.com/dncnwtts/map2fig"
license = "MIT"
keywords = ["healpix", "astronomy", "visualization", "mollweide", "fits"]
categories = ["science", "visualization"]

[dependencies]
cdshealpix = "0.7"
image = "0.24.9"
imageproc = "0.23.0"
rusttype = "0.9"
fitsrs = "0.4.1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
cairo-rs = { version = "0.19", features = ["pdf"] }
sha2 = "0.10"
tempfile = "3"
directories = "5.0"
serde_json = "1.0"
rayon = "1.8"

[features]
debug_overlay = []

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
