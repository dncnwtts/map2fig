[package]
name = "map2fig"
version = "0.6.0-pre.1"
edition = "2024"
authors = ["Duncan Watts"]
description = "Fast, publication-quality HEALPix sky map visualization in Rust"
documentation = "https://docs.rs/map2fig"
homepage = "https://github.com/dncnwtts/map2fig"
repository = "https://github.com/dncnwtts/map2fig"
license = "MIT"
keywords = ["healpix", "astronomy", "visualization", "mollweide", "fits"]
categories = ["science", "visualization"]
exclude = [
    "docs/",
    "examples/outputs/",
    "examples/output/",
    "perf.data",
    "perf.data.old",
    "target/",
    "test*.png",
    "smoke.png",
    "out*.txt",
]

[dependencies]
cdshealpix = "0.9"
image = "0.25"
imageproc = "0.26"
ab_glyph = "0.2"
fitsrs = "0.4"
rand = "0.10"
clap = { version = "4", features = ["derive"] }
cairo-rs = { version = "0.21", features = ["pdf"] }
sha2 = "0.10"
tempfile = "3"
directories = "6"
serde_json = "1.0"
rayon = "1.8"
libm = "0.2"
memmap2 = "0.9"
wide = "0.7"

[features]
debug_overlay = []
simd = []
nightly_simd = []
uncompressed-pdf = []

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = true
panic = "abort"
