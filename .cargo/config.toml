[build]
# Native CPU optimizations (take advantage of target machine features)
# This enables SIMD and other CPU-specific features on the compilation machine
# Using mold linker (2x faster than lld for most workloads on Linux)
# mold 2.30.0 provides ~40-70% faster linking than lld
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-fuse-ld=mold",
]

# Alternative linker options (if needed):
# - lld:  Cross-platform faster linker (~20-50% vs default ld)
#   rustflags = ["-C", "target-cpu=native", "-C", "link-arg=-fuse-ld=lld"]
# - wild: Linux only, newer but less tested, potentially faster than mold
#   rustflags = ["-C", "target-cpu=native", "-C", "link-arg=-fuse-ld=wild"]

# Parallel compiler frontend (Rust nightly only, ~15-20% potential speedup)
# Uncomment to enable. Requires: rustup +nightly
# RUSTFLAGS = "-Z threads=8"

# Alternative: Use sccache for distributed caching (if sharing dependencies across multiple projects)
# rustc-wrapper = "sccache"

[profile.dev]
# Use separate target directories for different tools to prevent cache invalidation
# This is a VS Code rust-analyzer-specific optimization
# Uncomment in .vscode/settings.json instead: "rust-analyzer.cargo.targetDir": true
